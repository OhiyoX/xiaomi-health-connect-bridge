# health.example.com + mcp.health.example.com 的 nginx 样例。
#
# 这是**样例**，不是自动安装的配置。复制到 edge/NAS 的 sites-available，
# 按实际证书路径与上游改好，先 `nginx -t` 再 reload；改前备份原 vhost。
#
# 上游二选一：
#   - nginx 在 edge（edge-host），经 FRP 到 NAS：127.0.0.1:18650
#   - nginx 直接在 NAS：192.0.2.9:18927（compose 发布到 NAS LAN 地址）
# 应用侧 HCB_TRUST_PROXY=1，且 HCB_TRUSTED_PROXIES 必须是本机看到的真实
# 反代/Docker 网关地址（/32 或最小 CIDR），不能是 172.16.0.0/12。
#
# 请求体上限按 location 设：
#   - OAuth 元数据/授权/令牌/注册/撤销：16k
#   - 登录/后台/账户表单：64k
#   - /mcp：1M（批量 JSON-RPC）
#   - /ingest：4M（手机批量推送；静态 Bearer 入口，不是 OAuth）
#
# /ingest 保持公网可达：edge/edge-host + FRP 拓扑下 nginx 看到的来源地址不是
# 手机真实 LAN 地址，allow/deny 私网 ACL 在这里不成立，也不要再写“仅 LAN”。
# 鉴权由应用层静态 Bearer 与 OAuth 403 保证；这里只加限流。
limit_req_zone $binary_remote_addr zone=hcb_ingest:10m rate=60r/m;

upstream hcb_nas {
    server 127.0.0.1:18650;
    keepalive 16;
}

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    server_name health.example.com mcp.health.example.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- 主站
server {
    listen 443 ssl http2;
    server_name health.example.com;

    server_tokens off;
    ssl_certificate     /etc/nginx/ssl/health.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/health.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 默认最小；下面按 location 放宽。
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 应用只信这个头；X-Forwarded-For 不被应用解析，显式清空避免误用。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # RFC 9728 / RFC 8414 元数据；应用返回 public max-age=300。
    location ^~ /.well-known/ {
        proxy_pass http://hcb_nas;
    }

    # OAuth 授权与令牌：不写 access log（URL/查询参数可能含 code/state），不缓存。
    # 应用自己发 Cache-Control: no-store；这里保持 server 级 HSTS 继承。
    location = /authorize {
        proxy_pass http://hcb_nas;
        access_log off;
    }
    location = /token {
        proxy_pass http://hcb_nas;
        access_log off;
    }
    location = /register {
        proxy_pass http://hcb_nas;
    }
    location = /revoke {
        proxy_pass http://hcb_nas;
    }

    # 登录、两步验证、登出、后台、账户；应用均发 no-store。
    location ^~ /login {
        proxy_pass http://hcb_nas;
    }
    location = /logout {
        proxy_pass http://hcb_nas;
    }
    location ^~ /admin {
        proxy_pass http://hcb_nas;
        client_max_body_size 64k;
    }
    location ^~ /account {
        proxy_pass http://hcb_nas;
        client_max_body_size 64k;
    }
    location = /admin.css {
        proxy_pass http://hcb_nas;
        expires 5m;
    }

    location = /health {
        proxy_pass http://hcb_nas;
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Streamable-HTTP MCP：可能返回 SSE，必须关闭 nginx 缓冲；不缓存。
    location = /mcp {
        proxy_pass http://hcb_nas;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 手机批量推送入口：公网可达，应用层只认静态 Bearer；OAuth 令牌即使
    # 有 health.write 也会被应用 403。edge/FRP 下不要用 LAN allow 列表。
    location = /ingest {
        proxy_pass http://hcb_nas;
        client_max_body_size 4m;
        proxy_request_buffering off;
        limit_req zone=hcb_ingest burst=20 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 其他路径一律不暴露。
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------- mcp.health
# 该域名只保留 /mcp（静态 Bearer）与 /health；明确拒绝 OAuth/后台/登录。
# 它需要两层子域证书；没有证书就不要启用这个 server 块。
server {
    listen 443 ssl http2;
    server_name mcp.health.example.com;

    server_tokens off;
    ssl_certificate     /etc/nginx/ssl/mcp.health.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/mcp.health.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /mcp {
        proxy_pass http://hcb_nas;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /health {
        proxy_pass http://hcb_nas;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 显式拒绝：这个域名不提供 OAuth 发现/授权/令牌/后台/登录。
    location ~ ^/(\.well-known|authorize|token|register|revoke|login|logout|admin|account) {
        return 404;
    }

    location / {
        return 404;
    }
}

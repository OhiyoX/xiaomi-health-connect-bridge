services:
  hc-health-mcp:
    image: python:3.12-slim
    container_name: hc-health-mcp
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/server.py"]
    env_file: .env
    volumes:
      # install.sh 把 server.py + hcb/ + hcb_admin.py 同步到这里；容器只读挂载。
      - ./app:/app:ro
      - ./data:/data
    ports:
      # 现网：host-b nginx (192.0.2.55) 与 FRP 都经 NAS 的 192.0.2.9 访问，
      # 不能绑 127.0.0.1，否则 health.example.com 会断。
      - "192.0.2.9:18927:18927"
    mem_limit: 192m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      # 镜像里没有 curl；用标准库探 /health。
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18927/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 构建时刻：存 **epoch 毫秒**，显示时按**设备当地时区**格式化。
// （不存现成的字符串：Gradle 守护进程的默认时区可能是 UTC，写出来的就是 08:55→00:55。）
def buildEpochMs = System.currentTimeMillis()
def buildZone = java.util.TimeZone.getDefault().getID()

android {
    namespace 'id.harness.hcbridge'
    compileSdk 36

    defaultConfig {
        applicationId "id.harness.hcbridge"
        minSdk 28
        targetSdk 34
        versionCode 19
        versionName "0.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "BUILD_EPOCH_MS", "${buildEpochMs}L"
        buildConfigField "String", "BUILD_ZONE", "\"$buildZone\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.time（LocalDate.ofInstant 等）在 minSdk 28 上要脱糖才能用
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.all {
            it.testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat "full"
            }
        }
    }

    // 门禁：lint 报错即失败（`./gradlew :app:lintDebug`）。发布构建同样检查。
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        xmlReport true
        htmlReport true
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // JVM 单测：只覆盖 logic/ 下的纯函数（无 Robolectric，秒级可跑）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'   // 让 JVM 单测能直接测解析逻辑（Android 的 org.json 在单测里是空实现）

    // java.time 脱糖（minSdk 28 < API 34）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // 仪器测试：手势/交互（在模拟器上跑，见 docs/TESTING.md）
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
